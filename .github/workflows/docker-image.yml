name: 下载docker镜像

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  pull-image:
    name: 获取镜像
    runs-on: ubuntu-latest
    steps:
      - name: 仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 开始任务
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::group::Soft Version"
          docker -v || echo 'no docker'
          node -v || echo 'no node'
          npm -v || echo 'no npm'
          bun -v || echo 'no bun'
          7z |grep "right"  ||  echo 'no 7z'
          7zz |grep "right" ||  echo 'no 7zz'
          echo "::endgroup::"
          ./ci-task
          