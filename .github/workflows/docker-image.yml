name: Pull and publish Docker image

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pull-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull image and publish Release asset with metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          commit_id=$(git rev-parse "$GITHUB_SHA")
          commit_message=$(git log -1 --format=%s "$commit_id")

          if [[ ! "$commit_message" =~ ^([^[:space:]]+)[[:space:]]+([^[:space:]]+)$ ]]; then
            echo "Skipping commit with no '<platform> <image>' subject: $commit_message"
            exit 0
          fi

          platform=${BASH_REMATCH[1]}
          image=${BASH_REMATCH[2]}
          image_file="$platform-$image.tar"
          image_file=${image_file//\//_}
          image_file=${image_file//:/__}
          docker pull --platform="$platform" "$image"
          docker save "$image" --output "$RUNNER_TEMP/$image_file"

          release_tag="${image_file}_${commit_id:0:5}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$RUNNER_TEMP/$image_file" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" "$RUNNER_TEMP/$image_file" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$commit_id" \
              --title "$commit_message" \
              --notes "$commit_message"
          fi

          # release_json=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets)
          # download_url=$(jq -er --arg name "$image_file" \
          #   '.assets[] | select(.name == $name) | .browserDownloadUrl' <<< "$release_json")

